quarkus.application.name=jfood-tracking
quarkus.http.port=8083

quarkus.cassandra.contact-points=127.0.0.1:9042
quarkus.cassandra.local-datacenter=datacenter1
quarkus.cassandra.keyspace=jfood_tracking

# O esquema pertence ao cql/01-keyspace-e-tabelas.cql, como na versao Spring.
quarkus.cassandra.devservices.enabled=false

# Timeout maior para o lote do teste de carga
quarkus.cassandra.request.timeout=10s
