quarkus.application.name=jfood-catalogo
quarkus.http.port=8082

quarkus.mongodb.connection-string=mongodb://admin:adminpassword@localhost:27017/?authSource=admin
jnosql.document.database=jfood_catalogo

quarkus.mongodb.devservices.enabled=false

# -----------------------------------------------------------------------------
# Etapa 9 item 8 — cache em Redis
# -----------------------------------------------------------------------------
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.devservices.enabled=false

# TTL global -- o equivalente do .entryTtl(Duration.ofMinutes(60)) do Spring
quarkus.cache.redis.expire-after-write=1h

# O Quarkus precisa saber o TIPO para desserializar, cache por cache.
#
# E aqui esta a diferenca de filosofia com o Spring: la o tipo viaja DENTRO do
# JSON (o default typing do Jackson, com o PolymorphicTypeValidator para nao
# virar RCE). Aqui o tipo e configuracao, declarada fora do dado.
#
# Consequencia pratica: o valor no Redis e JSON limpo, sem o ["classe", {...}] --
# e nao ha superficie de ataque de desserializacao polimorfica para blindar.
# Em troca, um cache sem value-type declarado falha em runtime.
quarkus.cache.redis.item-detalhe.value-type=br.com.unipds.jfood.catalogo.domain.ItemCardapio
quarkus.cache.redis.itens-busca.value-type=br.com.unipds.jfood.catalogo.domain.ResultadoBusca
