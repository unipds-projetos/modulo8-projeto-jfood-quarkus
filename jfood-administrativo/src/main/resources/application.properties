quarkus.application.name=jfood-administrativo
quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/jfood-db
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# DevServices desligados: o banco vem do docker-compose.yml na raiz do repo.
# Ligados, o Quarkus subiria um PostgreSQL efemero proprio -- e o seed de
# sql/aula03/ nao estaria la.
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.log.sql=true

# O esquema agora pertence ao Liquibase. Tira o Hibernate do jogo -- o
# equivalente exato do ddl-auto=none que o Flyway pediu na versao Spring.
quarkus.hibernate-orm.schema-management.strategy=none

# change-log aponta para um ARQUIVO, e nao para um diretorio: o Flyway varre
# db/migration/ por convencao de nome, o Liquibase le exatamente o que estiver
# declarado no changelog mestre.
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml

# Mesma convencao de nomes do Spring Boot: camelCase da entidade -> snake_case da
# tabela. E o que dispensa o @Column(name = "...") em cada atributo.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
