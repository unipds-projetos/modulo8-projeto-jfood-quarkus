quarkus.application.name=jfood-administrativo
quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/jfood-db
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# DevServices desligados: o banco vem do docker-compose.yml na raiz do repo.
# Ligados, o Quarkus subiria um PostgreSQL efemero proprio -- e o seed de
# sql/aula03/ nao estaria la.
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.log.sql=true

# validate, e nao update: o esquema foi criado a mao por sql/aula03/ e queremos a
# conferencia -- o equivalente exato do ddl-auto=validate da Parte 1.
# (A secao 3.7 da apostila mostra `update` porque la o projeto cria o proprio
# esquema; aqui ele ja existe.) A partir da Etapa 4 isto vira `none`, com o
# Liquibase no controle.
quarkus.hibernate-orm.schema-management.strategy=validate

# Mesma convencao de nomes do Spring Boot: camelCase da entidade -> snake_case da
# tabela. E o que dispensa o @Column(name = "...") em cada atributo.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
